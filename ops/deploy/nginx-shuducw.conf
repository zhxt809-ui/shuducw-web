# 管理端登录限流（5次/分钟/IP，防暴力破解）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 默认拒绝块：拦截所有未匹配域名（防子域名乱发）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 裸域名 HTTPS -> 统一跳转 www（防重复内容，统一收录地址）
server {
    listen 443 ssl;
    server_name shuducw.com;
    ssl_certificate /etc/letsencrypt/live/www.shuducw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.shuducw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://www.shuducw.com$request_uri;
}

# 服务器 IP 与未知域名 HTTPS -> 直接拒绝（默认块，防子域名探测/接管）
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 8.152.3.67 _;
    ssl_certificate /etc/letsencrypt/live/www.shuducw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.shuducw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 444;
}

# 正式站点（仅 www.shuducw.com）
server {
    server_name www.shuducw.com;

    server_tokens off; # 隐藏 nginx 版本号

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/xhtml+xml;
    gzip_vary on;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /_next/static/ {
        alias /var/www/shuducw-run/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        alias /var/www/shuducw-run/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 管理端登录/鉴权接口限流
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/consultations {
        limit_req zone=consult_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.shuducw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.shuducw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS www（统一跳转到 www 收录地址）
server {
    listen 80;
    server_name www.shuducw.com shuducw.com 8.152.3.67;
    return 301 https://www.shuducw.com$request_uri;
}
